name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run detection tests
        run: node test-cross-catch.mjs

  # main への push は Vercel GitHub Integration が Production を自動デプロイする。
  # ここではデプロイ完了を GitHub Deployments API で確認する。
  verify-vercel-production:
    name: Verify Vercel production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      deployments: read
      contents: read
    steps:
      - name: Wait for Vercel Production deployment
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const deadline = Date.now() + 3 * 60 * 1000;

            async function findProduction() {
              const { data } = await github.rest.repos.listDeployments({
                owner,
                repo,
                sha,
                environment: 'Production',
                per_page: 5,
              });
              return data[0] || null;
            }

            let deployment = null;
            while (Date.now() < deadline) {
              deployment = await findProduction();
              if (deployment) break;
              await new Promise((r) => setTimeout(r, 5000));
            }

            if (!deployment) {
              core.setFailed(`No Vercel Production deployment found for ${sha}. Check Vercel Git integration.`);
              return;
            }

            let state = 'pending';
            while (Date.now() < deadline) {
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                owner,
                repo,
                deployment_id: deployment.id,
                per_page: 5,
              });
              state = statuses[0]?.state || 'pending';
              core.info(`Deployment ${deployment.id}: ${state}`);
              if (state === 'success') {
                core.info('Vercel Production OK — https://ai-speed-gun-pro.vercel.app');
                return;
              }
              if (state === 'failure' || state === 'error') {
                core.setFailed(`Vercel Production deployment ${state}`);
                return;
              }
              await new Promise((r) => setTimeout(r, 5000));
            }
            core.setFailed(`Timed out waiting for Vercel Production (last state: ${state})`);
